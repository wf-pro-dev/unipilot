
services:
  nodejs:
    image: wwwill-1.lab:5000/unipilot/nodejs:${IMAGE_TAG:-latest}
    build:
      context: /home/will/unipilot
      dockerfile: docker/Dockerfile.nodejs
    networks:
      - unipilot
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SESSION_KEY=${SESSION_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=${QDRANT_HOST:-unipilot-qdrant}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-./logs}
      - LOG_CONSOLE_ENABLED=${LOG_CONSOLE_ENABLED:-true}
    volumes:
      - nodejs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nodejs_logs:

networks:
  unipilot:
    external: true
