bind 0.0.0.0
port 6379
# Password is set via command-line argument --requirepass in docker-compose
# requirepass ${REDIS_PASSWORD}

# Memory settings
maxmemory 1024mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Security
protected-mode yes
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Performance
timeout 0
tcp-keepalive 300
lua-time-limit 5000

# Logging
loglevel notice
logfile ""

