
# Unipilot API upstream
upstream unipilot-api {
    server 100.68.63.59:3000; 
}

# Unipilot SSE (Server-Sent Events) upstream
upstream unipilot-sse {
    server 100.68.63.59:3000; 
}

# Unipilot API routes
location /unipilot/api/v1/ {
    proxy_pass http://unipilot-api/; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 15s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}



# Unipilot SSE routes (longer timeouts for real-time connections)
location /unipilot/events/v1/ {
    proxy_pass http://unipilot-sse/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # SSE-specific settings
    proxy_buffering off;
    proxy_read_timeout 24h;
    proxy_connect_timeout 1s;
}

